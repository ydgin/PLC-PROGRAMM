<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>PLS INVEST - Облік лічильників та пломб</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>

<!-- PIN ЕКРАН -->
<div id="pinScreen" class="pin-screen">
    <div class="pin-card">
        <div class="pin-lock">🔒</div>
        <div class="pin-title">PLS INVEST</div>
        <div class="pin-subtitle">Введіть PIN-код</div>
        <div id="pinDisplay" class="pin-display"></div>
        <div id="pinError" class="pin-error"></div>
        <div class="pin-keyboard">
            <div class="pin-row">
                <button class="pin-btn" data-num="1">1</button>
                <button class="pin-btn" data-num="2">2</button>
                <button class="pin-btn" data-num="3">3</button>
            </div>
            <div class="pin-row">
                <button class="pin-btn" data-num="4">4</button>
                <button class="pin-btn" data-num="5">5</button>
                <button class="pin-btn" data-num="6">6</button>
            </div>
            <div class="pin-row">
                <button class="pin-btn" data-num="7">7</button>
                <button class="pin-btn" data-num="8">8</button>
                <button class="pin-btn" data-num="9">9</button>
            </div>
            <div class="pin-row">
                <button class="pin-btn pin-clear" data-num="clear">⌫</button>
                <button class="pin-btn" data-num="0">0</button>
                <button class="pin-btn pin-enter" data-num="enter">✓</button>
            </div>
        </div>
        <div id="pinForgot" class="pin-forgot">Скинути PIN</div>
    </div>
</div>

<!-- ГОЛОВНИЙ ДОДАТОК -->
<div id="mainApp" class="hidden">
    <div class="container">
        <div class="card header-card">
            <h1>🏦 PLS INVEST</h1>
            <div class="sub">Облік лічильників та пломб</div>
        </div>

        <!-- Особовий рахунок -->
        <div class="card">
            <label class="field-label">📋 Особовий рахунок (10 цифр)</label>
            <div class="input-scan-row">
                <input id="accountNumber" class="field-input" type="tel" placeholder="1234567890" maxlength="10" inputmode="numeric">
                <button class="btn-scan" data-target="accountNumber" data-mode="digits">📷</button>
                <button class="btn-save-field" data-field="accountNumber" data-label="Особовий рахунок">💾</button>
            </div>
            <div id="accountScanner" class="scanner-container hidden"></div>
        </div>

        <!-- Лічильник -->
        <div class="card">
            <label class="field-label">🔢 Лічильник (8 цифр)</label>
            <div class="input-scan-row">
                <input id="meterNumber" class="field-input" type="tel" placeholder="12345678" maxlength="8" inputmode="numeric">
                <button class="btn-scan" data-target="meterNumber" data-mode="smart">📷</button>
                <button class="btn-save-field" data-field="meterNumber" data-label="Лічильник">💾</button>
            </div>
            <div id="meterScanner" class="scanner-container hidden"></div>
            <div class="info-hint">ℹ️ При скануванні ігноруються перші 4 та останні 4 цифри</div>
        </div>

        <!-- Пломба кришки -->
        <div class="card">
            <label class="field-label">🔒 Пломба кришки</label>
            <div class="input-scan-row">
                <input id="sealCoverNumber" class="field-input seal-input" type="text" placeholder="Номер пломби" autocomplete="off">
                <button class="btn-scan" data-target="sealCoverNumber" data-mode="text">📷</button>
                <button class="btn-save-field" data-field="sealCoverNumber" data-label="Пломба кришки">💾</button>
            </div>
            <div id="sealCoverScanner" class="scanner-container hidden"></div>
            <div id="sealCoverResults" class="search-results hidden"></div>
        </div>

        <!-- Пломба оптопорту -->
        <div class="card">
            <label class="field-label">🔒 Пломба оптопорту</label>
            <div class="input-scan-row">
                <input id="sealOptoNumber" class="field-input seal-input" type="text" placeholder="Номер пломби" autocomplete="off">
                <button class="btn-scan" data-target="sealOptoNumber" data-mode="text">📷</button>
                <button class="btn-save-field" data-field="sealOptoNumber" data-label="Пломба оптопорту">💾</button>
            </div>
            <div id="sealOptoScanner" class="scanner-container hidden"></div>
            <div id="sealOptoResults" class="search-results hidden"></div>
        </div>

        <!-- Адреса -->
        <div class="card">
            <label class="field-label">📍 Адреса</label>
            <div class="input-scan-row">
                <input id="address" class="field-input" type="text" placeholder="Введіть адресу">
                <button class="btn-scan" data-target="address" data-mode="text">📷</button>
                <button class="btn-save-field" data-field="address" data-label="Адреса">💾</button>
            </div>
            <div id="addressScanner" class="scanner-container hidden"></div>
        </div>

        <!-- ЗАГАЛЬНА КНОПКА ЗБЕРЕЖЕННЯ -->
        <div class="save-container">
            <button id="saveRecordBtn" class="btn-save-all">💾 ЗБЕРЕГТИ ВСЕ В ЖУРНАЛ</button>
        </div>

        <!-- БАЗА ПЛОМБ -->
        <div class="card">
            <div class="flex-between">
                <label class="field-label">📦 БАЗА ПЛОМБ</label>
                <button id="addSealBtn" class="btn-small">➕ Додати пломбу</button>
            </div>
            <div id="sealAddPanel" class="seal-add-panel hidden">
                <div class="seal-add-row">
                    <input type="text" id="newSealInput" class="field-input" placeholder="Номер пломби">
                    <button id="confirmSealBtn" class="btn-small-ok">✔</button>
                    <button id="cancelSealBtn" class="btn-small-cancel">✖</button>
                </div>
            </div>
            <input type="text" id="sealSearch" class="seal-search" placeholder="🔍 Пошук по базі пломб...">
            <div id="sealsList" class="seals-list"></div>
        </div>

        <!-- ЖУРНАЛ РОБІТ -->
        <div class="card">
            <div class="btn-group">
                <button id="exportBtn" class="btn-outline">📄 Експорт CSV</button>
                <button id="clearLogBtn" class="btn-danger">🗑 Очистити журнал</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Дата</th><th>Особовий</th><th>Лічильник</th><th>Пломба кришки</th><th>Пломба оптопорту</th><th>Адреса</th><th></th></tr>
                    </thead>
                    <tbody id="logTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
